<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鸣潮账户登录</title>
<style>body{font:16px system-ui,sans-serif;color:#1d2939;background:#f4f6fa;max-width:440px;margin:8vh auto;padding:24px}main{background:white;padding:28px;border-radius:16px}h1{font-size:24px}label{display:block;margin:20px 0 8px}input,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #cbd5e1;border-radius:8px}button{margin-top:12px;background:#2457c5;color:white}button:disabled{opacity:.6}p{line-height:1.6}#state{color:#384c68}</style>
<main><h1>鸣潮账户登录</h1><p>仅用于本人查询与已确认的签到、提醒。验证码登录成功后，请返回 QQ 确认账户；确认前不会绑定。此页面三分钟后失效。</p>
<label for="phone">中国大陆手机号</label><input id="phone" inputmode="tel" autocomplete="off" maxlength="11"><button id="sms" disabled>获取短信验证码</button>
<label for="code">短信验证码</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8"><button id="verify">验证账户</button><p id="state" role="status">正在加载官方人机验证…</p></main>
<script src="https://static.geetest.com/v4/gt4.js"></script><script>
const base=location.pathname.replace(/\/$/,''), phone=document.getElementById('phone'), code=document.getElementById('code'), state=document.getElementById('state'), sms=document.getElementById('sms'), verify=document.getElementById('verify');
async function post(path,data){const response=await fetch(base+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),cache:'no-store',referrerPolicy:'no-referrer'});const result=await response.json();if(!response.ok)throw Error(result.error||'请求失败');return result;}
let challenge;
if(window.initGeetest4){initGeetest4({captchaId:'ec4aa4174277d822d73f2442a165a2cd',product:'bind'},captcha=>{challenge=captcha;captcha.onReady(()=>{sms.disabled=false;state.textContent='请获取验证码，完成官方人机验证。'}).onSuccess(async()=>{try{const result=captcha.getValidate();result.captcha_id='ec4aa4174277d822d73f2442a165a2cd';await post('/sms',{phone:phone.value,captcha:result});state.textContent='短信已发送，请输入验证码。';setTimeout(()=>sms.disabled=false,60000);}catch(error){state.textContent=error.message;sms.disabled=false;}}).onError(()=>{state.textContent='人机验证未完成，请重试。';sms.disabled=false;});});}
else{state.textContent='官方人机验证未加载，请检查网络后重新打开链接。';}
sms.onclick=()=>{if(!/^1[3-9]\d{9}$/.test(phone.value)){state.textContent='请输入中国大陆手机号。';return;}sms.disabled=true;challenge.showCaptcha();};
verify.onclick=async()=>{verify.disabled=true;try{await post('/verify',{code:code.value});phone.value=code.value='';sms.disabled=true;state.textContent='验证成功。请返回 QQ 查看账户概要，并发送 ww确认。';}catch(error){state.textContent=error.message;verify.disabled=false;}};
const poll=setInterval(async()=>{try{const response=await fetch(base+'/status',{cache:'no-store',referrerPolicy:'no-referrer'});if(!response.ok){clearInterval(poll);state.textContent='链接已失效。请返回 QQ 重新发起登录。';phone.value=code.value='';sms.disabled=verify.disabled=true;}else{const result=await response.json();if(result.status==='awaiting_confirmation'){state.textContent='验证成功。请返回 QQ 确认绑定。';sms.disabled=verify.disabled=true;}}}catch(error){state.textContent='连接暂时中断，请检查网络。';}},5000);
</script></html>
