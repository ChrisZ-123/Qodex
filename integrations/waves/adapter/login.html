<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鸣潮账户登录</title>
<style>body{font:16px system-ui,sans-serif;color:#1d2939;background:#f4f6fa;max-width:440px;margin:8vh auto;padding:24px}main{background:white;padding:28px;border-radius:16px}h1{font-size:24px}label{display:block;margin:20px 0 8px}input,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #cbd5e1;border-radius:8px}button{margin-top:12px;background:#2457c5;color:white}button:disabled{opacity:.6}p{line-height:1.6}#state{color:#384c68}</style>
<main><h1>鸣潮账户登录</h1><p>验证码验证成功后，请返回申请此链接的 QQ 确认绑定：<strong id="target">正在加载…</strong>。此链接可被他人打开；短信验证只展示账户摘要，必须由上述 QQ 返回原会话确认后才会绑定。链接三分钟内有效。</p>
<label for="phone">中国大陆手机号</label><input id="phone" inputmode="tel" autocomplete="off" maxlength="11" disabled><button id="sms" disabled>获取短信验证码</button>
<label for="code">短信验证码</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" disabled><button id="verify" disabled>验证账户</button><p id="state" role="status">正在加载登录状态和官方人机验证…</p></main>
<script src="https://static.geetest.com/v4/gt4.js"></script><script>
const base=location.pathname.replace(/\/$/,''), phone=document.getElementById('phone'), code=document.getElementById('code'), state=document.getElementById('state'), sms=document.getElementById('sms'), verify=document.getElementById('verify'), target=document.getElementById('target');
let challenge, loaded=false, captchaReady=false, finished=false, busy=false, cooldown=false, loginStatus='pending', poll;
function controls(){phone.disabled=!loaded||finished||busy;code.disabled=!loaded||finished||busy||loginStatus!=='sms_sent';sms.disabled=!loaded||!captchaReady||finished||busy||cooldown;verify.disabled=!loaded||finished||busy||loginStatus!=='sms_sent';}
function stop(message){finished=true;clearInterval(poll);phone.value=code.value='';controls();state.textContent=message;}
function apply(result){if(finished)return;if(result.targetQQ){target.textContent=result.targetQQ;loaded=true;}loginStatus=result.status;if(result.status==='confirmed'){const account=result.account;stop('绑定成功。QQ：'+result.targetQQ+'；UID：'+account.uid+'；昵称：'+account.nickname+'。可返回 QQ 查询账户。');return;}if(['expired','failed','rejected'].includes(result.status)){stop('登录未完成或链接已失效，请返回 QQ 重新发起登录。');return;}if(result.status==='awaiting_confirmation'){const account=result.account;stop('短信验证成功。待绑定 QQ：'+result.targetQQ+'；UID：'+account.uid+'；昵称：'+account.nickname+'。请返回原 QQ 会话核对并确认绑定。');return;}controls();}
async function post(path,data){const response=await fetch(base+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),cache:'no-store',referrerPolicy:'no-referrer'});const result=await response.json();if(!response.ok)throw Error(result.error||'请求失败');return result;}
async function refresh(){if(finished||busy)return;try{const response=await fetch(base+'/status',{cache:'no-store',referrerPolicy:'no-referrer'});if(finished)return;if(!response.ok){stop('链接已失效。请返回 QQ 重新发起登录。');return;}const result=await response.json();if(finished)return;const wasLoaded=loaded;apply(result);if(!finished&&!wasLoaded){state.textContent=captchaReady?'请获取验证码，完成官方人机验证。':'正在加载官方人机验证…';}}catch(error){if(!finished)state.textContent='连接暂时中断，请检查网络。';}}
if(window.initGeetest4){initGeetest4({captchaId:'ec4aa4174277d822d73f2442a165a2cd',product:'bind'},captcha=>{challenge=captcha;captcha.onReady(()=>{captchaReady=true;controls();if(loaded&&!finished)state.textContent='请获取验证码，完成官方人机验证。';}).onSuccess(async()=>{if(finished||!loaded)return;busy=true;controls();try{const validation=captcha.getValidate();validation.captcha_id='ec4aa4174277d822d73f2442a165a2cd';const result=await post('/sms',{phone:phone.value,captcha:validation});apply(result);if(!finished){state.textContent='短信已发送，请输入验证码。';cooldown=true;setTimeout(()=>{cooldown=false;controls();},60000);}}catch(error){if(!finished)state.textContent=error.message;}finally{busy=false;controls();}}).onError(()=>{if(!finished){state.textContent='人机验证未完成，请重试。';busy=false;controls();}}).onClose(()=>{busy=false;controls();});});}
else{state.textContent='官方人机验证未加载，请检查网络后重新打开链接。';}
sms.onclick=()=>{if(finished||!loaded||!captchaReady)return;if(!/^1[3-9]\d{9}$/.test(phone.value)){state.textContent='请输入中国大陆手机号。';return;}busy=true;controls();challenge.showCaptcha();};
verify.onclick=async()=>{if(finished||!loaded||busy)return;busy=true;controls();try{apply(await post('/verify',{code:code.value}));}catch(error){if(!finished)state.textContent=error.message;}finally{busy=false;controls();}};
poll=setInterval(refresh,5000);refresh();
</script></html>
