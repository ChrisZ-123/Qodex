name: Windows checks

on:
  push:
    branches: [main]
    tags: ['qodex-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Node 24 / Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
        env:
          QQ_BRIDGE_TEST_LIVE: '0'
  waves:
    name: Python 3.11 / Windows / fixture only
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install exact public sources and dependency pins without game resources
        shell: pwsh
        run: python integrations/waves/install.py --root "$env:RUNNER_TEMP\Qodex 中文 空格\waves" --skip-resources
      - name: Python adapter and binding transactions without accounts
        shell: pwsh
        run: '& "$env:RUNNER_TEMP\Qodex 中文 空格\waves\venv\Scripts\python.exe" integrations/waves/run_tests.py --root "$env:RUNNER_TEMP\Qodex 中文 空格\waves"'
